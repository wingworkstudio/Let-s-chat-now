<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lets-chatnow · 登录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-dot"></span>
      <h1>lets-chatnow</h1>
    </div>
    <p class="login-sub">私聊 · 群聊 · 圈子 · AI，一站式聊不停</p>
    <input id="nickname" type="text" placeholder="输入昵称登录" maxlength="12" autocomplete="off">
    <button id="loginBtn">进入聊天</button>
    <p class="login-tip">数据保存在本机浏览器，仅供演示</p>
  </div>
  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
